<header class="barra">
  <div class="barra-interna">
    <a routerLink="/" class="marca">
      <span class="luna" aria-hidden="true">☾</span>
      VesperaRoom
    </a>

    <nav aria-label="Principal">
      <a routerLink="/moteles" routerLinkActive="activo">Moteles</a>
    </nav>

    <div class="acciones">
      @if (invitarDuenos()) {
        <a class="duenos" routerLink="/registro" [queryParams]="{ rol: 'PROPIETARIO' }">¿Eres dueño de un motel?</a>
      }

      @if (sesion.actual(); as usuario) {
        <details class="menu" #menu>
          <summary>
            <span class="avatar" aria-hidden="true">{{ usuario.nombre.charAt(0) }}</span>
            {{ usuario.nombre }}
          </summary>
          <ul>
            @for (enlace of enlaces(); track enlace.ruta) {
              <li>
                <a [routerLink]="enlace.ruta" routerLinkActive="activo" (click)="menu.open = false">{{ enlace.texto }}</a>
              </li>
            }
            <li>
              <button type="button" class="plano" (click)="menu.open = false; salir()">Cerrar sesión</button>
            </li>
          </ul>
        </details>
      } @else {
        <a routerLink="/login" class="acceso">Iniciar sesión</a>
        <a routerLink="/registro" class="acceso">Crear cuenta</a>
      }
    </div>
  </div>
</header>

<main class="contenedor">
  <router-outlet />
</main>
