<header class="barra">
  <div class="barra-interna">
    <a routerLink="/" class="marca">
      <span class="luna" aria-hidden="true">☾</span>
      VesperaRoom
    </a>

    <nav>
      @for (enlace of enlaces(); track enlace.ruta) {
        <a
          [routerLink]="enlace.ruta"
          routerLinkActive="activo"
          [routerLinkActiveOptions]="{ exact: enlace.ruta === '/' }"
        >
          {{ enlace.texto }}
        </a>
      }
    </nav>

    <div class="fila">
      @if (sesion.actual(); as usuario) {
        <span class="pequeno suave">{{ usuario.nombre }}</span>
        <button type="button" class="plano" (click)="salir()">Salir</button>
      } @else {
        <a routerLink="/login" class="acceso">Iniciar sesión</a>
        <a routerLink="/registro" class="acceso">Crear cuenta</a>
      }
    </div>
  </div>
</header>

<main class="contenedor">
  <router-outlet />
</main>
