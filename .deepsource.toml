version = 1

exclude_patterns = [
  "front/dist/**",
  "front/.angular/**",
  "vesperaroom_Backend/target/**",
  "vesperaroom_Backend/bin/**",
  # Scripts generados del Maven Wrapper: la variable de contraseña opcional que leen da un falso positivo de secretos.
  "**/mvnw",
  "**/mvnw.cmd",
]

test_patterns = [
  "front/src/**/*.spec.ts",
  "vesperaroom_Backend/src/test/**",
]

[[analyzers]]
name = "javascript"
enabled = true
dependency_file_paths = ["front/"]

  [analyzers.meta]
  plugins = ["angular"]
  environment = ["browser", "vitest"]
  module_system = "es-modules"
  dialect = "typescript"

[[analyzers]]
name = "java"
enabled = true

  [analyzers.meta]
  runtime_version = "21"
