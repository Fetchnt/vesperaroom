version = 1

exclude_patterns = [
  "front/dist/**",
  "front/.angular/**",
  "target/**",
]

test_patterns = [
  "front/src/**/*.spec.ts",
]

[[analyzers]]
name = "javascript"
enabled = true
dependency_file_paths = ["front/"]

  [analyzers.meta]
  plugins = ["angular"]
  environment = ["browser", "vitest"]
  module_system = "es-modules"
  dialect = "typescript"
