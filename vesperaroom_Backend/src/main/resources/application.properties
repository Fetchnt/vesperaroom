spring.application.name=vesperaroom

# Secretos locales (DB_PASSWORD, JWT_SECRET, ...) en .env.properties, fuera del repositorio
spring.config.import=optional:file:.env.properties

# Conexion JDBC a MySQL (el esquema se crea con los scripts de /database, no se autogenera)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/vesperaroom
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never

# JWT: la clave debe tener al menos 32 caracteres
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Correo SMTP (por defecto Gmail con contrasena de aplicacion). Sin credenciales
# la app arranca igual, pero los codigos de recuperacion no llegan (queda en el log)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# CORS: origenes permitidos separados por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Cada cuantos milisegundos se revisan los estados de las reservas (60 s)
app.reservas.intervalo-ms=${RESERVAS_INTERVALO_MS:60000}

# Administrador precargado al arrancar (si la contrasena esta vacia no se crea)
app.admin.correo=${ADMIN_CORREO:admin@vesperaroom.com}
app.admin.telefono=${ADMIN_TELEFONO:3000000000}
app.admin.contrasena=${ADMIN_PASSWORD:}
